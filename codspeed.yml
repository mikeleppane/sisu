benchmarks:
  - name: fib
    id: fib
    exec: target/codspeed/fib/main
  - name: sieve
    id: sieve
    exec: target/codspeed/sieve/main
  - name: binary_trees
    id: binary_trees
    exec: target/codspeed/binary_trees/main
  - name: check_binary_trees
    id: check_binary_trees
    exec: target/release/sisuc --check bench/binary_trees/main.sisu
  - name: build_binary_trees
    id: build_binary_trees
    exec: target/release/sisuc -O2 bench/binary_trees/main.sisu target/codspeed/build_binary_trees/main
  - name: check_large
    id: check_large
    exec: target/release/sisuc --check target/codspeed/large/main.sisu
  - name: build_large
    id: build_large
    exec: target/release/sisuc -O2 target/codspeed/large/main.sisu target/codspeed/build_large/main
