experimental = ["setup-scripts"]

[scripts.setup.build-runtime]
command = "scripts/build-runtime.sh"

[profile.ci]
# Report every failure, not just the first.
fail-fast = false
failure-output = "immediate-final"

# A quadratic lexer regression hangs this test instead of failing it, so kill it fast.
[[profile.default.overrides]]
filter = 'test(long_gaps_lex_correctly)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Panic-site locations once scanned the text from the start, so codegen was quadratic and this
# test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_panic_sites_compile_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each render once cost the whole file, so many diagnostics in a large file were quadratic and
# this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(rendering_many_diagnostics_in_a_large_file_is_linear)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each unclosed string literal once rescanned every earlier diagnostic, so many of them were
# quadratic and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_unclosed_strings_lex_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each `todo!` once scanned the file's line breaks, so many of them were quadratic and this test
# hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(many_todo_bangs_parse_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Each `u8` parameter around a join would check it twice over, so nested joins would be
# exponential and this test would hang instead of failing.
[[profile.default.overrides]]
filter = 'test(nested_joins_check_in_quadratic_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A call `switch(...)` once was parsed twice, as C's `switch` and then as a call, so nested calls
# were exponential and this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(nested_switch_calls_parse_in_linear_time)'
slow-timeout = { period = "10s", terminate-after = 3 }

# A harness that writes all of standard input before it reads the output would fill both pipes
# and hang on these tests instead of failing them.
[[profile.default.overrides]]
filter = "binary(programs) & (test(stdin_larger_than_a_pipe) | test(program_exiting_before_its_input_ends))"
slow-timeout = { period = "10s", terminate-after = 3 }

# Each word once rescanned the line from its start, so a long line was quadratic and this test
# hangs instead of failing.
[[profile.default.overrides]]
filter = 'binary(programs) & test(words_is_linear)'
slow-timeout = { period = "10s", terminate-after = 3 }

# Without a size check, sisuc reads the whole 1 GiB file and reports each of its NUL bytes, so
# this test hangs instead of failing.
[[profile.default.overrides]]
filter = 'test(oversized_input_is_a_tool_error)'
slow-timeout = { period = "10s", terminate-after = 3 }

[[profile.default.scripts]]
filter = "package(sisuc) & kind(test)"
setup = "build-runtime"

# Valgrind tests are slow and memory hungry, so cap how many run at once.
[test-groups]
valgrind = { max-threads = 4 }

# The `bless_` and `same_name_in_two_modes` fixtures call `support::run`, which runs Valgrind.
[[profile.default.overrides]]
filter = "binary(programs) & (test(allocation_counts) | test(valgrind_reports_a_cycle) | test(read_line_refills_its_buffer) | test(/^bless_/) | test(same_name_in_two_modes))"
test-group = "valgrind"

# Each case compiles twice and runs under Valgrind; a hang is killed after three minutes. The
# orphan checks only read the directory, so they stay out of the group.
[[profile.default.overrides]]
filter = "binary(cases) & test(/^(run|run_fail)::/)"
test-group = "valgrind"
slow-timeout = { period = "60s", terminate-after = 3 }
