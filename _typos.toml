# Did-you-mean tests need near-miss names such as `tru` or `wdth`.

[default]
# A Rust test keeps a deliberate typo with a trailing `// spellchecker:disable-line`.
extend-ignore-re = ["(?Rm)^.*(#|//)\\s*spellchecker:disable-line$"]

[files]
# The fixtures are compiler input and output, where misspelled names are the point.
extend-exclude = ["crates/sisuc/tests/diagnostics/"]
